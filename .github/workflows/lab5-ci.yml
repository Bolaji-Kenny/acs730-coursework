name: lab5-ci

on:
  push:
    branches: [main]
    paths:
      - "lab5/**"
      - ".github/workflows/lab5-ci.yml"
  pull_request:
    paths:
      - "lab5/**"
      - ".github/workflows/lab5-ci.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: lab5

jobs:
  static:
    name: static (fmt + validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: terraform fmt -check
        run: terraform fmt -check -recursive
      - name: terraform init (no backend)
        run: terraform init -backend=false -input=false
      - name: terraform validate
        run: terraform validate

  localstack:
    name: plan and apply against LocalStack
    needs: static
    runs-on: ubuntu-latest
    services:
      localstack:
        image: localstack/localstack:3.8.1
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Dummy values: LocalStack does not check them. No real AWS credentials in CI.
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Wait for LocalStack
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:4566/_localstack/health && exit 0
            sleep 2
          done
          echo "LocalStack did not become ready" >&2
          exit 1
      - name: terraform init
        run: terraform init -input=false
      - name: terraform plan
        run: terraform plan -input=false -var-file=localstack.tfvars -out=tfplan
      - name: terraform apply
        run: terraform apply -input=false tfplan
      - name: Show outputs
        run: terraform output
      - name: terraform destroy
        run: terraform destroy -input=false -auto-approve -var-file=localstack.tfvars
      - name: Teardown check (describe-vpcs)
        run: |
          aws --endpoint-url http://localhost:4566 ec2 describe-vpcs \
            --query 'Vpcs[?Tags[?Key==`Project` && Value==`acs730-lab5`]].VpcId' --output text

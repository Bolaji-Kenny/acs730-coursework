name: lab4-ci

on:
  push:
    branches: [main]
    paths:
      - "lab4/**"
      - ".github/**"
  pull_request:
    paths:
      - "lab4/**"
      - ".github/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: lab4
        run: pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: lab4
        run: pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t lab4:ci lab4

      - name: Smoke test
        run: |
          docker run -d -p 8000:8000 --name smoke lab4:ci
          sleep 3
          curl --fail localhost:8000/health

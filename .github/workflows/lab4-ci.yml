name: lab4-ci

on:
  push:
    branches: [main]
    paths:
      - "lab4/**"
      - ".github/**"
  pull_request:
    paths:
      - "lab4/**"
      - ".github/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: lab4/requirements-dev.txt

      - name: Install dependencies
        working-directory: lab4
        run: pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: lab4
        run: pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: lab4
          load: true
          tags: lab4:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save image to a file
        run: docker save lab4:ci | gzip > image.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: lab4-image
          path: image.tar.gz
          retention-days: 1

  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: lab4-image

      - name: Load and run image
        run: |
          echo "Testing image built from commit ${{ needs.build.outputs.tag }}"
          docker load < image.tar.gz
          docker run -d -p 8000:8000 --name smoke lab4:ci
          sleep 3
          curl --fail localhost:8000/health

  summary:
    needs: [test, build, smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write summary
        run: |
          {
            echo "## lab4-ci summary"
            echo "- test: ${{ needs.test.result }}"
            echo "- build: ${{ needs.build.result }}"
            echo "- smoke: ${{ needs.smoke.result }}"
            echo "- image tag: ${{ needs.build.outputs.tag }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if any upstream job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

name: lab4-ci

on:
  push:
    branches: [main]
    paths:
      - "lab4/**"
      - ".github/**"
  pull_request:
    paths:
      - "lab4/**"
      - ".github/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/python-deps
        with:
          python-version: ${{ matrix.python-version }}
          requirements: lab4/requirements-dev.txt

      - name: Run tests
        working-directory: lab4
        run: pytest

  build:
    needs: test
    uses: ./.github/workflows/docker-build.yml
    with:
      context: lab4

  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: lab4-image

      - name: Load and run image
        run: |
          echo "Testing image built from commit ${{ needs.build.outputs.tag }}"
          docker load < image.tar.gz
          docker run -d -p 8000:8000 --name smoke lab4:ci
          sleep 3
          curl --fail localhost:8000/health

  publish:
    needs: [build, smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Lowercase repository name
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: lab4-image

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Load, tag, and push
        run: |
          docker load < image.tar.gz
          IMAGE=ghcr.io/${{ steps.repo.outputs.name }}/lab4:${{ github.sha }}
          docker tag lab4:ci "$IMAGE"
          docker push "$IMAGE"
          echo "Pushed $IMAGE"

  summary:
    needs: [test, build, smoke, publish]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write summary
        run: |
          {
            echo "## lab4-ci summary"
            echo "- test: ${{ needs.test.result }}"
            echo "- build: ${{ needs.build.result }}"
            echo "- smoke: ${{ needs.smoke.result }}"
            echo "- publish: ${{ needs.publish.result }}"
            echo "- image tag: ${{ needs.build.outputs.tag }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if any upstream job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
